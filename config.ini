# 存储后端：embedded（默认，SQLite + 内存缓存 + Chroma）
#           external（开发机原模式：MySQL + Redis + Milvus）
[storage]
backend = embedded

# 本地服务配置（便携包由 launcher 指定端口，这里作为默认值）
[server]
host = 127.0.0.1
port = 8080

# MySQL 配置（仅 external 模式使用）
[mysql]
host = localhost
user = root
password = 1234
database = subjects_kg

# Redis 配置（仅 external 模式使用）
[redis]
host = localhost
port = 6379
# password = 1234
db = 0

# 日志配置（相对路径会写到用户数据目录的 logs/ 下）
[logger]
log_file = logs/app.log

# Milvus 配置（仅 external 模式使用）
[milvus]
uri = http://localhost:19530
database_name = llyRAG
collection_name = rag_kb

# LLM 配置
# API Key 建议在首次启动的网页设置中填写，会保存到用户目录，不写入本文件。
[llm]
model = deepseek-chat
llm_api_key =
llm_base_url = https://api.deepseek.com

# 检索参数配置
[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 3
candidate_m = 2

# 应用配置
[app]
valid_sources = ["ai", "java", "test", "ops", "bigdata"]
customer_service_phone = 13800001234
