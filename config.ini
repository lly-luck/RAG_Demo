# MySQL 配置
[mysql]
host = localhost
user = root
password = 1234
database = subjects_kg

# Redis 配置
[redis]
host = localhost
port = 6379
# password = 1234
db = 0

# 日志配置
[logger]
log_file = logs/app.log


# Milvus 配置
[milvus]
uri=http://localhost:19530
database_name = llyRAG
collection_name = edurag


# LLM 配置
[llm]
model = deepseek-flash
llm_api_key = sk-xxxx
llm_base_url = https://api.deepseek.com


# 检索参数配置
[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 3
candidate_m = 2

# 应用配置
[app]
valid_sources = ["ai", "java", "test", "ops", "bigdata"]
customer_service_phone = 13800001234