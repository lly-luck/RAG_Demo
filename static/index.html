<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#060b17">
    <title>智慧问答系统 · 智能知识问答</title>

    <!-- 首帧前确定主题，避免深色/浅色闪烁 -->
    <script>
        (function () {
            try {
                if (localStorage.getItem('darkMode') !== 'false') {
                    document.documentElement.classList.add('dark-mode');
                }
            } catch (e) { /* 隐私模式下 localStorage 不可用时忽略 */ }
        })();
    </script>

    <!-- 站点图标 -->
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <!-- 主题样式 -->
    <link rel="stylesheet" href="/static/style.css">
    <!-- 图标库 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Markdown 解析 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- ==================== 机器人科技背景 ==================== -->
    <div class="bg-layer" aria-hidden="true">
        <div class="bg-glow bg-glow-1"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow bg-glow-2"></div>
        <div class="bg-vignette"></div>
    </div>

    <!-- ==================== 顶部导航 ==================== -->
    <header class="app-header">
        <div class="brand">
            <div class="brand-mark"><i class="fas fa-robot"></i></div>
            <div class="brand-text">
                <h1>智慧问答系统</h1>
                <p>RAG · 智能知识问答</p>
            </div>
        </div>
        <div class="header-actions">
            <div class="badge-pill"><span class="pulse-dot"></span>RAG 智能检索</div>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题" title="切换主题">
                <i class="fas fa-sun"></i>
            </button>
        </div>
    </header>

    <!-- ==================== 主体 ==================== -->
    <div class="container">
        <div class="chat-container">
            <!-- 侧边栏：搜索 / 会话控制 / 历史 -->
            <aside class="sidebar">
                <div class="search-field">
                    <i class="fas fa-magnifying-glass"></i>
                    <input type="text" class="search-box" id="searchBox" placeholder="搜索历史会话..."
                        aria-label="搜索历史会话" autocomplete="off">
                </div>

                <div class="session-controls">
                    <button class="new-session-btn" id="newSessionBtn" type="button">
                        <i class="fas fa-plus"></i> 新会话
                    </button>
                    <button class="clear-history-btn" id="clearHistoryBtn" type="button">
                        <i class="fas fa-trash"></i> 清除历史
                    </button>
                </div>

                <div class="history-title">
                    <i class="fas fa-clock-rotate-left"></i> 历史会话
                </div>

                <div class="history-list" id="historyList">
                    <!-- 历史会话将动态添加到这里 -->
                </div>

                <div class="session-info" id="sessionInfo">会话ID: 未创建</div>
            </aside>

            <!-- 聊天区 -->
            <section class="main-content">
                <!-- 机器人水印：位于面板之上、消息之下，磨砂气泡会把它自然虚化 -->
                <div class="chat-robot" aria-hidden="true">
                    <svg viewBox="0 0 320 352" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- 环绕轨道 -->
                        <g class="robot-orbit" opacity="0.45">
                            <circle cx="160" cy="140" r="146" stroke="currentColor" stroke-width="1"
                                stroke-dasharray="4 12" />
                            <circle cx="160" cy="140" r="128" stroke="currentColor" stroke-width="1" opacity="0.5" />
                            <circle cx="306" cy="140" r="4" fill="currentColor" />
                            <circle cx="14" cy="140" r="3" fill="currentColor" />
                            <circle cx="160" cy="-6" r="3" fill="currentColor" opacity="0.7" />
                        </g>

                        <g class="robot-float">
                            <!-- 天线 -->
                            <line x1="160" y1="30" x2="160" y2="52" stroke="currentColor" stroke-width="3"
                                stroke-linecap="round" />
                            <circle class="robot-antenna" cx="160" cy="22" r="7" stroke="currentColor"
                                stroke-width="2.5" />

                            <!-- 头部 -->
                            <rect x="72" y="52" width="176" height="132" rx="42" stroke="currentColor"
                                stroke-width="3" />
                            <!-- 侧耳 -->
                            <rect x="50" y="92" width="20" height="52" rx="10" stroke="currentColor"
                                stroke-width="3" />
                            <rect x="250" y="92" width="20" height="52" rx="10" stroke="currentColor"
                                stroke-width="3" />
                            <!-- 面罩 -->
                            <rect x="92" y="78" width="136" height="72" rx="28" stroke="currentColor"
                                stroke-width="2" opacity="0.55" />
                            <!-- 眼睛 -->
                            <rect class="robot-eye" x="116" y="98" width="26" height="32" rx="13"
                                fill="currentColor" />
                            <rect class="robot-eye" x="178" y="98" width="26" height="32" rx="13"
                                fill="currentColor" />
                            <!-- 嘴 -->
                            <path d="M146 164h28" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                                opacity="0.7" />

                            <!-- 颈部 -->
                            <rect x="140" y="184" width="40" height="14" rx="7" stroke="currentColor"
                                stroke-width="2.5" />
                            <!-- 身体 -->
                            <rect x="80" y="198" width="160" height="116" rx="34" stroke="currentColor"
                                stroke-width="3" />
                            <!-- 胸口能量核心 -->
                            <circle class="robot-core" cx="160" cy="246" r="22" stroke="currentColor"
                                stroke-width="2.5" />
                            <circle class="robot-core-dot" cx="160" cy="246" r="8" fill="currentColor" />
                            <!-- 身体纹路 -->
                            <path d="M112 292h96" stroke="currentColor" stroke-width="2" opacity="0.5" />
                            <path d="M128 304h64" stroke="currentColor" stroke-width="2" opacity="0.3" />

                            <!-- 手臂 -->
                            <rect x="44" y="208" width="24" height="82" rx="12" stroke="currentColor"
                                stroke-width="3" />
                            <rect x="252" y="208" width="24" height="82" rx="12" stroke="currentColor"
                                stroke-width="3" />
                            <circle cx="56" cy="302" r="12" stroke="currentColor" stroke-width="3" />
                            <circle cx="264" cy="302" r="12" stroke="currentColor" stroke-width="3" />

                            <!-- 悬浮底座 -->
                            <ellipse class="robot-base" cx="160" cy="336" rx="84" ry="10" stroke="currentColor"
                                stroke-width="2" stroke-dasharray="6 8" />
                        </g>
                    </svg>
                </div>

                <div class="chat-history" id="chatHistory">
                    <!-- 消息将动态添加到这里 -->
                    <div class="message system-message">
                        <div class="message-header">
                            <div class="avatar"><i class="fas fa-robot"></i></div>
                            <span>智能助手</span>
                        </div>
                        <div class="message-content">
                            您好！我是智能问答助手，有什么我可以帮您的吗？
                        </div>
                    </div>
                </div>

                <div class="chat-input-container">
                    <div class="composer">
                        <div class="composer-top">
                            <label class="source-filter" for="sourceFilter">
                                <i class="fas fa-layer-group"></i>
                                <span>技术方向</span>
                                <select id="sourceFilter">
                                    <option value="">全部</option>
                                    <!-- 技术方向选项将动态添加 -->
                                </select>
                            </label>
                            <div class="input-tools">
                                <button class="tool-btn" id="emojiBtn" type="button" title="表情" aria-label="表情">
                                    <i class="far fa-smile"></i>
                                </button>
                                <button class="tool-btn" id="imageBtn" type="button" title="图片" aria-label="图片">
                                    <i class="far fa-image"></i>
                                </button>
                                <button class="tool-btn" id="fileBtn" type="button" title="文件" aria-label="文件">
                                    <i class="far fa-file"></i>
                                </button>
                            </div>
                        </div>

                        <div class="input-group">
                            <textarea class="chat-input" id="chatInput" rows="1" spellcheck="false"
                                aria-label="输入您的问题"
                                placeholder="请输入您的问题…（Enter 发送，Shift + Enter 换行）"
                                oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
                            <button class="send-btn" id="sendBtn" type="button" aria-label="发送消息">
                                <i class="fas fa-paper-plane"></i><span>发送</span>
                            </button>
                        </div>
                    </div>

                    <!-- 快捷提问 -->
                    <div class="quick-replies" id="quickReplies">
                        <button class="quick-reply-btn" type="button">什么是人工智能？</button>
                        <button class="quick-reply-btn" type="button">机器学习有哪些算法？</button>
                        <button class="quick-reply-btn" type="button">如何学习 Python？</button>
                    </div>
                </div>

                <div class="loading-overlay" id="loadingOverlay" role="status" aria-live="polite">
                    <div class="spinner" aria-hidden="true"></div>
                    <span class="sr-only">加载中</span>
                </div>
            </section>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
